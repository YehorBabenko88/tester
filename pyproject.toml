[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tester-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["src.api*"]

[tool.setuptools.package-data]
"src.api" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/api/**/*.py", "tests/platform/**/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
