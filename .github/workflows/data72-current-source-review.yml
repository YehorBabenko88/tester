name: DATA72 exact-current-source review
on:
  pull_request:
    paths:
      - "scripts/verify_data72_current_source.py"
      - "docs/coordination/data72-9d7e-source-delta.json"
      - "docs/coordination/data72-9d7e-minimal-runtime.json"
      - "docs/coordination/data72-de95-current-source-review.md"
      - ".github/workflows/data72-current-source-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch independent pinned Git sources in CI-only workspace
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            3b2eef8a4139195db1a775545e83f1c1f58bf403 \
            4581e415bd8979a4debee1eb56120bb21b9d95fd \
            9d7e45be0872c4c5efa17c06bc107e1dc6a0d2fb \
            de95aef6ed46842063fc7c2ef766b7da75fe540e; do
            git fetch --no-tags origin "$sha"
            test "$(git rev-parse "$sha^{commit}")" = "$sha"
          done
          before="$(git status --porcelain --untracked-files=normal)"
          python scripts/verify_data72_current_source.py
          after="$(git status --porcelain --untracked-files=normal)"
          test "$before" = "$after"
          echo "CURRENT_SOURCE_31_PATHS_10_PENDING_NO_DB_NO_INSTALL"
