name: DATA to RESEARCH execution contract
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/ingest/execution_contract.py'
      - 'src/ingest/public_auxiliary*.py'
      - 'src/ingest/public_access.py'
      - 'src/ingest/rest.py'
      - 'src/ingest/transport.py'
      - 'src/api/release_database.py'
      - 'src/api/migrations/**'
      - 'src/api/transport_policy.py'
      - 'src/storage/**'
      - 'src/analytics/research_metrics.py'
      - 'src/analytics/core.py'
      - 'src/analytics/statistics.py'
      - 'src/integration/data_research_adapter.py'
      - 'src/integration/research_preview.py'
      - 'src/integration/research_ui_projection.py'
      - 'src/api/capability_*.py'
      - 'src/api/analytics_readback.py'
      - 'src/api/main.py'
      - 'tests/api/test_analytics_readback_round3.py'
      - 'tests/platform/test_analytics_readback_integration_round3.py'
      - 'tests/test_execution_contract_*.py'
      - 'tests/test_public_auxiliary*.py'
      - 'tests/test_composed_data_research_postgres.py'
      - 'tests/platform/test_*issue59.py'
      - 'tests/platform/test_capability_data_bridge_issue104.py'
      - 'tests/platform/test_inverse_units_canonical.py'
      - 'tests/platform/test_runtime_privileges_issue114.py'
      - 'scripts/ci_data_research_mandatory.py'
      - 'scripts/ci_e_ingest_mandatory.py'
      - 'scripts/ci_named_junit_gate.py'
      - 'tests/platform/test_ci_named_junit_gate_round14.py'
      - 'tests/platform/test_ci_named_junit_gate_round19.py'
      - 'tests/ingest/test_pipeline.py'
      - 'tests/api/test_analytics_readback_round3.py'
      - '.github/workflows/data-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: contract-pg${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: tester_aux_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: tester_aux_ci
        ports: ['55479:5432']
        options: >-
          --health-cmd "pg_isready -U tester_aux_ci -d tester_aux_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTER_EXPECT_PG_MAJOR: ${{ matrix.postgres }}
      TESTER_EXPECT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TESTER_AUX_TEST_DSN: postgresql://tester_aux_ci:disposable-only@127.0.0.1:55479/tester_aux_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove actual disposable PostgreSQL server major
        run: |
          server_num="$(psql "$TESTER_AUX_TEST_DSN" -tAc 'SHOW server_version_num' | tr -d '[:space:]')"
          test "$((server_num / 10000))" -eq "${{ matrix.postgres }}"
          echo "Verified actual PostgreSQL major ${{ matrix.postgres }} on disposable 127.0.0.1:55479"
      - run: python -m pip install -r requirements-dev.txt
      - name: Install isolated Chromium for PG→API→browser acceptance
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Initialize fail-closed PG evidence directory
        run: |
          mkdir -p .scratch/mandatory-evidence/pg${{ matrix.postgres }}
      - name: Offline DATA and RESEARCH contracts
        run: >-
          python -m pytest -q
          tests/test_public_auxiliary.py
          tests/test_public_auxiliary_runner.py
          tests/test_execution_contract_bridge.py
          tests/platform/test_research_metrics_issue59.py
          tests/platform/test_research_preview_issue59.py
          tests/platform/test_research_preview_adapter_issue59.py
          tests/platform/test_research_composed_negative_issue59.py
          tests/platform/test_data_research_adapter_issue59.py
          tests/platform/test_capability_data_bridge_issue104.py
          tests/platform/test_inverse_units_canonical.py
          tests/api/test_analytics_readback_round3.py
          tests/platform/test_analytics_readback_integration_round3.py
      - name: Offline/required PostgreSQL phase regressions (mandatory negative cases)
        run: |
          python -m pytest -q -rs tests/platform/test_data_pg_phase_round35.py -k 'not test_required_pg_disposable_dsn_executes_real_backend_overlap'
      - name: PostgreSQL DATA roundtrip (dedicated database)
        run: |
          psql "$TESTER_AUX_TEST_DSN" -c "CREATE DATABASE tester_aux_roundtrip"
          TESTER_AUX_TEST_DSN="${TESTER_AUX_TEST_DSN%/*}/tester_aux_roundtrip" \
            python -m pytest -q -rs tests/test_public_auxiliary_postgres.py tests/test_execution_contract_postgres.py
      - name: Composed DATA to RESEARCH read (dedicated database)
        run: |
          psql "$TESTER_AUX_TEST_DSN" -c "CREATE DATABASE tester_aux_composed"
          TESTER_AUX_TEST_DSN="${TESTER_AUX_TEST_DSN%/*}/tester_aux_composed" \
            python -m pytest -q -rs tests/test_composed_data_research_postgres.py
      - name: RESEARCH adapter against real PostgreSQL (dedicated database)
        run: |
          psql "$TESTER_AUX_TEST_DSN" -c "CREATE DATABASE tester_research_data_disposable"
          TESTER_REQUIRE_RESEARCH_PG=1 TESTER_RESEARCH_BROWSER_E2E=1 TESTER_RESEARCH_DATA_TEST_DSN="${TESTER_AUX_TEST_DSN%/*}/tester_research_data_disposable" \
            python -m pytest -vv -rs tests/platform/test_data_research_adapter_issue59.py tests/platform/test_analytics_readback_integration_round3.py
          TESTER_REQUIRE_RESEARCH_PG=1 TESTER_RESEARCH_DATA_TEST_DSN="${TESTER_AUX_TEST_DSN%/*}/tester_research_data_disposable" \
            python -m pytest -q -rs tests/platform/test_data_pg_phase_round35.py -k test_required_pg_disposable_dsn_executes_real_backend_overlap
      - name: Reject altered, incomplete, skipped or XPASS JUnit evidence
        run: |
          mkdir -p .scratch/mandatory-evidence/pg${{ matrix.postgres }}
          python -m pytest -q -o xfail_strict=true --timeout=30 -p no:cacheprovider --junitxml=${RUNNER_TEMP}/validator-negative-pg${{ matrix.postgres }}.xml tests/platform/test_ci_named_junit_gate_round14.py tests/platform/test_ci_named_junit_gate_round19.py
      - name: Strict mandatory PG16/18 research E2E and E rollback (JUnit exact inventory, NO SKIP)
        env:
          TESTER_REQUIRE_RESEARCH_PG: '1'
        run: |
          python scripts/ci_data_research_mandatory.py
      - name: Mandatory E REST slow-trickle/deadline/encoding six regressions
        run: |
          python scripts/ci_e_ingest_mandatory.py
      - name: Release grants, DATA paths and spot/linear/inverse units as NON-superuser tester_app (#104, #114)
        # provision_release_databases creates tester_owner-owned databases and the
        # restricted runtime role; every DATA/queue flow then runs as tester_app.
        env:
          TESTER_PRIVILEGE_TEST_ADMIN_DSN: host=127.0.0.1 port=55479 dbname=tester_aux_ci user=tester_aux_ci password=disposable-only
        run: python -m pytest -q -rs tests/platform/test_runtime_privileges_issue114.py
      - name: Preserve failure-phase evidence without PASS fabrication
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          major = os.environ["TESTER_EXPECT_PG_MAJOR"]
          location = Path(".scratch/mandatory-evidence") / f"pg{major}"
          location.mkdir(parents=True, exist_ok=True)
          report = location / "ci-failure-phase.json"
          report.write_text(json.dumps({
              "schema": "tester.data.ci-failure-phase/1",
              "head_sha": os.environ["TESTER_EXPECT_HEAD_SHA"],
              "expected_pg_major": major,
              "status": "NOT_VERIFIED",
              "canonical_postgresql_credit": 0,
              "canonical_data20_credit": 0,
              "note": "Failure marker only; inspect original job logs for the failed step",
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve sanitized exact-head PG${{ matrix.postgres }} JUnit and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-data-research-pg${{ matrix.postgres }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .scratch/mandatory-evidence/pg${{ matrix.postgres }}/
          if-no-files-found: error
