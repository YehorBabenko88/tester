name: Research Issue 59 isolated checks
on:
  pull_request:
    paths:
      - "src/analytics/research_metrics.py"
      - "src/integration/research_preview.py"
      - "tests/platform/test_research_metrics_issue59.py"
      - "tests/platform/test_research_preview_issue59.py tests/platform/test_research_preview_adapter_issue59.py"
      - "tests/platform/test_research_preview_adapter_issue59.py"
      - ".github/workflows/research-issue59.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "psycopg[binary]>=3.2,<4"
      - name: Compile research sources and tests
        run: python -m compileall -q src/analytics/research_metrics.py src/integration/research_preview.py tests/platform/test_research_metrics_issue59.py tests/platform/test_research_preview_issue59.py tests/platform/test_research_preview_adapter_issue59.py
      - name: Focused tests
        run: python -m pytest -q tests/platform/test_research_metrics_issue59.py tests/platform/test_research_preview_issue59.py tests/platform/test_research_preview_adapter_issue59.py
      - name: Ruff research sources
        run: python -m ruff check src/analytics/research_metrics.py src/integration/research_preview.py tests/platform/test_research_metrics_issue59.py tests/platform/test_research_preview_issue59.py tests/platform/test_research_preview_adapter_issue59.py
