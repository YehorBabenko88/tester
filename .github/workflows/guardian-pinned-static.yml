name: Guardian pinned static integration preflight
on:
  pull_request:
    paths:
      - 'scripts/guardian_pinned_static_gate.py'
      - 'scripts/guardian_assembly_plan.py'
      - 'tests/platform/test_guardian_assembly_plan.py'
      - 'docs/guardians/guardian-static-pins.json'
      - '.github/workflows/guardian-pinned-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source:
    runs-on: ubuntu-latest
    env:
      GUARDIANS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Ruff only for read-only static gate
        run: python -m pip install ruff==0.17.4 pytest
      - name: Verify exact checkout and Ruff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m ruff check scripts/guardian_pinned_static_gate.py
          python -m ruff format --check scripts/guardian_pinned_static_gate.py
      - name: Inspect four pinned Guardian trees without executing them
        run: python scripts/guardian_pinned_static_gate.py
      - name: Verify fail-closed assembly receipt tests
        run: python -m pytest -q tests/platform/test_guardian_assembly_plan.py
