name: PostgreSQL 18 principal-isolation security E2E
on:
  pull_request:
    paths:
      - 'src/api/migrations/**'
      - 'src/api/db.py'
      - 'src/api/transport_policy.py'
      - 'tests/platform/test_transport_principal_isolation_round8.py'
      - 'tests/platform/test_public_transport_policy.py'
      - 'scripts/ci_pg18_principal_isolation.py'
      - 'scripts/ci_named_junit_gate.py'
      - 'tests/platform/test_ci_named_junit_gate_round14.py'
      - '.github/workflows/postgres18-principal-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg18-principal-security-required:
    name: pg18-principal-security-required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tester_ci_admin
          POSTGRES_PASSWORD: disposable-admin-only
          POSTGRES_DB: postgres
        ports: ['55820:5432']
        options: >-
          --health-cmd "pg_isready -U tester_ci_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTER_PG18_SECURITY_ADMIN_DSN: postgresql://tester_ci_admin:disposable-admin-only@127.0.0.1:55820/postgres?require_auth=scram-sha-256
      PYTHONUNBUFFERED: '1'
      TESTER_EXPECT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned platform test dependencies
        run: |
          python -m pip install 'pip>=26.2,<27'
          python -m pip install -e '.[dev]' -c requirements-platform.lock
      - name: Reject forged JUnit identity, suite counters and skip status
        run: |
          mkdir -p .scratch/mandatory-evidence/pg18
          python -m pytest -q -o xfail_strict=true --timeout=30 -p no:cacheprovider --junitxml=${RUNNER_TEMP}/validator-negative-pg18.xml tests/platform/test_ci_named_junit_gate_round14.py
      - name: Mandatory REAL PostgreSQL18 principal isolation E2E (zero SKIP)
        run: python scripts/ci_pg18_principal_isolation.py
      - name: Retain sanitized exact-source PG18 security JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-pg18-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: .scratch/mandatory-evidence/pg18/
          if-no-files-found: error
