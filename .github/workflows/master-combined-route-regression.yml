name: MASTER combined route graph regression (CI only)
on:
  pull_request:
    paths:
      - src/api/main.py
      - src/api/capability_discovery.py
      - src/api/capability_data_bridge.py
      - src/api/capability_source_contracts.py
      - tests/platform/test_combined_route_contract_ui74.py
      - .github/workflows/master-combined-route-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TESTER_AUX_LIVE_BYBIT: "no"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -e '.[dev]' -c requirements-platform.lock
      - name: Verify exact route graph, 13 timeframes and fail-closed panels
        run: |
          set -euo pipefail
          python -m pytest -q tests/platform/test_combined_route_contract_ui74.py tests/platform/test_combined_routes.py
      - name: Verify no native launch or production database configuration
        run: |
          test "${TESTER_AUX_LIVE_BYBIT}" = no
          echo "CI_ONLY_NO_NATIVE_NO_PRODUCTION_POSTGRES"
